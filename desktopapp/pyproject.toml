[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athletemotion-desktop"
version = "0.2.0"
description = "Athlete Motion — Aplicação Desktop de Alta Performance para Análise Biomecânica de Ciclismo (Bikefit)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "Athlete Motion Team" }
]
dependencies = [
    "PyQt6>=6.7.0",
    "pyqtgraph>=0.13.4",
    "numpy>=1.26.0,<3.0.0",
    "opencv-python>=4.9.0",
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
directml = [
    "onnxruntime-directml>=1.18.0",
]
openvino = [
    "openvino>=2024.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-psutil>=5.9.0",
]

[project.scripts]
athletemotion-desktop = "athletemotion_desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athletemotion_desktop"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
# `files` existe para que um `mypy` sem argumentos verifique o mesmo que o CI: sem ele, o
# comando não verifica **nada** (o mypy exige caminhos) e um `mypy` que passa é um mypy que
# não olhou para o código. Os testes entram na verificação de tipos — o tipo de um dobre de
# teste mal tipado esconde erros reais nos testes que dele dependem.
files = ["src", "tests"]

# O `py-cpuinfo` (usado pela sonda de hardware da D02) não publica stubs nem
# `py.typed`, e não existe pacote `types-py-cpuinfo`. A alternativa a este override
# seria espalhar `# type: ignore` pelo código de produção, o que esconderia erros
# reais desse módulo; aqui a exceção fica declarada num único local, com o motivo.
[[tool.mypy.overrides]]
module = ["cpuinfo"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--strict-markers` é essencial neste projeto: a seleção do CI faz-se por marcadores
# (`-m "not slow and not needs_camera and not directml"`), e um marcador escrito com erro
# ortográfico deixaria um teste de GPU a correr em silêncio no runner errado.
addopts = [
    "--strict-markers",
    "--strict-config",
    "--timeout=300",
]
# O `timeout` acima é a rede de segurança contra hangs de multiprocessing/Qt; o método
# `thread` imprime a stack do que ficou preso antes de abortar a execução inteira, ao
# contrário de um simples `signal` (que não existe no Windows para este efeito).
# Os testes de robustez marcados `slow` sobrepõem-no com `@pytest.mark.timeout(...)`.
timeout_method = "thread"
timeout_func_only = true
markers = [
    "unit: unidade pura, sem I/O real (é o que corre sempre)",
    "integration: atravessa módulos, processos ou o arranque da aplicação",
    "ui: interface com pytest-qt, sempre com QT_QPA_PLATFORM=offscreen",
    "perf: medição de desempenho com limites de orçamento (arranque, latência, FPS)",
    "slow: longa duração (corridas de robustez de minutos); excluído do CI por omissão",
    "directml: exige onnxruntime-directml (ou WARP) no ambiente",
    "needs_camera: exige câmara real ligada; nunca corre por omissão",
    "no_leak_check: dispensa o portão de fugas (só em testes que provocam fugas de propósito)",
]

[tool.coverage.run]
source = ["athletemotion_desktop"]
branch = false

[tool.coverage.report]
# Só se exclui o que não é código executável em produção. `pragma: no cover` é usado no
# código para caminhos defensivos/POSIX documentados, não para esconder lógica sem testes.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
# Medido em 91,9 % na D14 (339 testes). O limite fica 4 pontos abaixo: uma regressão real
# (um módulo novo sem testes, um caminho de erro por cobrir) acciona o limite, enquanto uma
# oscilação de refactor não transforma o portão em ruído.
fail_under = 88
