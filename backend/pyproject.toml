[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athletemotion"
dynamic = ["version"]
description = "Plataforma Profissional de Análise Biomecânica de Postura e BikeFit em Tempo Real"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "websockets>=12.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python>=4.9.0.80",
    "pillow>=10.3.0",
    "scipy>=1.12.0",
    "mediapipe>=0.10.14",
    "reportlab>=4.1.0",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pip-audit>=2.8.0",
]
directml = [
    "onnxruntime-directml>=1.17.0",
]
openvino = [
    "openvino>=2024.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "directml: testes que exigem DirectML / hardware GPU Windows",
    "slow: testes de execução prolongada",
    "integration: testes de integração com múltiplos módulos / DB / WS",
]

[tool.coverage.run]
source = ["athletemotion"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (segurança)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (delegado ao formatador)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "SIM108", # use ternary operator (nem sempre favorece legibilidade)
    "RUF001", # ambiguous unicode character in string (usamos traço en-dash propositadamente)
    "RUF002", # ambiguous unicode character in docstring (usamos × para resolução 640×640)
    "RUF003", # ambiguous unicode character in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # use of assert detected
    "S105",   # possible hardcoded password
    "S106",   # possible hardcoded password
    "S311",   # standard pseudo-random generators
    "S108",   # probable insecure usage of temp file/dir
]
"scripts/*" = [
    "S101",
    "S603",
    "S607",
    "S110",
    "S103",
    "E402",
]
"src/athletemotion/domain/inference/*" = [
    "S311",
    "E402",
]
"src/athletemotion/infrastructure/hardware.py" = [
    "S110",   # try-except-pass intencional para deteção opcional de psutil e configs de ORT
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "athletemotion.domain.biomechanics.*",
    "athletemotion.schemas.*",
]
strict = true

