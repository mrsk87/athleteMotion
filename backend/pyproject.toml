[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "athletemotion"
dynamic = ["version"]
description = "Plataforma Profissional de Análise Biomecânica de Postura e BikeFit em Tempo Real"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "websockets>=12.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python>=4.9.0.80",
    "pillow>=10.3.0",
    "scipy>=1.12.0",
    "mediapipe>=0.10.14",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
directml = [
    "onnxruntime-directml>=1.17.0",
]
openvino = [
    "openvino>=2024.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
