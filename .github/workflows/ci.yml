name: CI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-windows:
    name: Backend (Windows ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade Pip and Build Tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies (Dev + DirectML)
        working-directory: backend
        run: |
          pip install -e ".[dev,directml]"

      - name: Validate SemVer Synchronization
        shell: bash
        run: |
          python -c "
          import json
          from pathlib import Path
          v_file = Path('backend/VERSION').read_text().strip()
          p_json = json.loads(Path('frontend/web/package.json').read_text())['version']
          assert v_file == p_json, f'Inconsistência SemVer: VERSION ({v_file}) != package.json ({p_json})'
          print(f'SemVer validado e sincronizado: v{v_file}')
          "

      - name: Static Analysis (Ruff Linter)
        working-directory: backend
        run: |
          ruff check src tests scripts

      - name: Code Formatting (Ruff Format Check)
        working-directory: backend
        run: |
          ruff format --check src tests scripts

      - name: Type Checking (mypy strict domain/schemas)
        working-directory: backend
        run: |
          mypy src/athletemotion/domain/biomechanics src/athletemotion/schemas

      - name: Run Pytest Suite with Coverage Gate (fail-under >= 70%)
        working-directory: backend
        run: |
          pytest -v --cov=athletemotion --cov-fail-under=70 --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Dependency Vulnerability Audit (pip-audit)
        working-directory: backend
        run: |
          pip-audit

      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  backend-ubuntu-cpu:
    name: Backend Domain & Unit Tests (Ubuntu CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade Pip
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools

      - name: Install Dependencies (CPU only - no DirectML wheels)
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Run Pytest Unit Tests
        working-directory: backend
        run: |
          pytest tests/unit/ -v

  frontend-quality:
    name: Frontend Lint, Build & Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Run Frontend Production Build
        working-directory: frontend/web
        run: npm run build

      - name: Run Frontend Verification Scripts
        working-directory: frontend/web
        run: npm run verify

      - name: Security Audit (npm audit)
        working-directory: frontend/web
        run: npm audit --omit=dev --audit-level=high
